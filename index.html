<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker - Scheda Allenamento</title>
    <link rel="manifest" href="manifest.json">
	
	<link rel="apple-touch-icon" href="icon.png">
		<meta name="theme-color" content="#121212">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e6fef0',
                            100: '#c2fbd7',
                            500: '#00E676',
                            600: '#00c853',
                            700: '#00a340',
                            900: '#004d1a',
                            accent: '#eab308'
                        },
                        dark: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            border: '#2a2a2a',
                            input: '#121212'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- docx library for Word Export -->
    <script src="https://unpkg.com/docx@8.2.3/build/index.umd.js"></script>
    <!-- FileSaver for triggering downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .swipe-card {
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            will-change: transform, opacity;
        }
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            touch-action: pan-y;
            background-color: #121212;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .last-used-glow {
            border: 2px solid #00E676 !important;
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.4) !important;
        }
    </style>
</head>
<body class="min-h-screen pb-16 flex flex-col items-center justify-start antialiased selection:bg-brand-500 selection:text-black">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md min-h-screen flex flex-col bg-slate-950 shadow-2xl relative overflow-x-hidden border-x border-slate-800">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
                <div class="p-2 bg-gradient-to-tr from-brand-600 to-emerald-400 rounded-xl text-slate-950 font-black shadow-lg shadow-brand-500/20">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-black tracking-tight text-lg text-white leading-none">GYM<span class="text-brand-500">TRACK</span></h1>
                    <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Schede & Workouts</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-2"></div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto"></main>

        <!-- Toast Notifications -->
        <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-brand-500 text-slate-950 font-bold px-4 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
            <span id="toast-message" class="text-sm">Notifica</span>
        </div>

        <!-- Generic Confirm Modal -->
        <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl space-y-4">
                <h3 id="modal-title" class="text-lg font-bold text-white">Conferma Azione</h3>
                <p id="modal-body" class="text-sm text-slate-400">Sei sicuro di voler procedere?</p>
                <div class="flex items-center space-x-2 justify-end pt-2">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition">Annulla</button>
                    <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Conferma</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Modal (For exercise editing / inputs) -->
        <div id="dynamic-modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div id="dynamic-modal-content" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            </div>
        </div>

    </div>

    <script>
        // Default Base Template Definition
        const DEFAULT_SCHEDA = {
            id: "default_scheda_base",
            title: "Scheda 4 Giorni Base",
            days: [
                {
                    name: "GIORNO 1",
                    exercises: [
                        { name: "CHEST PRESS", target: ["8", "8", "8", "8"] },

                {

                    exercises: [
                        { name: "LAT MACHINE CON TRIANGOLO", target: ["6/8", "6/8", "6/8", "6/8"] },
                        { name: "ROWING STRETTA", target: ["10", "8", "6"] },
                        { name: "PULLEY", target: ["8/10", "8/10", "8/10", "8/10"] },
                        { name: "PECK BACK", target: ["10", "10", "10"] },
                        { name: "FRENCH PRESS BILANC. STESO", target: ["8", "8", "8"] },
                        { name: "PUSH DOWN CON FUNE", target: ["8", "8", "8"] }
                    ]
                },
                {
                    name: "GIORNO 4",
                    exercises: [
                        { name: "PEC FLY", target: ["10", "10", "10"] },
                        { name: "PANCA 30° AL MULTIPOWER", target: ["10", "8", "6"] },
                        { name: "REMATORE BILANC PRESA INVERSA", target: ["10", "8", "6"] },
                        { name: "CURL MARTELLO IN PIEDI + PUSH DOWN CON ASTA CURVA", target: ["8", "8", "8"] },
                        { name: "HACK SQUAT", target: ["8/10", "8/10", "8/10"] },
                        { name: "AFFONDI SUL POSTO", target: ["10", "10", "10"] }
                    ]
                }
            ]
        };

        const INITIAL_ROUTINE_COMPLETED = {
            id: "routine_21_10_2026",
            title: "Scheda 21 Ottobre 2026",
            createdDate: "2026-10-21T09:00:00.000Z",
            schedaId: "default_scheda_base",
            days: [
                {
                    name: "GIORNO 1",
                    exercises: [
                        { name: "CHEST PRESS", target: ["8", "8", "8", "8"], weight: ["N/A", "N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A", "N/A"], note: "" },
                        { name: "PECTORAL MACHINE", target: ["10", "8", "6"], weight: ["N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A"], note: "" },
                        { name: "CHEST INCLINE", target: ["8", "8", "8", "8"], weight: ["15", "15", "12.5", "N/A"], rep: ["8", "5", "5", "N/A"], note: "" },
                        { name: "ALZATE FRONTALI CON BILANC.", target: ["12", "12", "12"], weight: ["N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A"], note: "" },
                        { name: "CURL BILANC. IN PIEDI", target: ["10/8", "10/8", "10/8"], weight: ["N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A"], note: "" },
                        { name: "CURL MACHINE SINGOLA", target: ["8", "8", "8"], weight: ["N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A"], note: "" }
                    ]
                },
                {
                    name: "GIORNO 2",
                    exercises: [
                        { name: "LEG EXTENSION", target: ["10", "8", "6"], weight: ["20", "25", "30"], rep: ["10", "8", "8"], note: "" },
                        { name: "PRESSA 45°", target: ["8/10", "8/10", "8/10"], weight: ["30", "40", "45"], rep: ["10", "10", "8"], note: "" },
                        { name: "LEG CURL STESO", target: ["10", "10", "10"], weight: ["15", "15", "10"], rep: ["10", "6", "7"], note: "" },
                        { name: "PENDULUM SQUAT", target: ["8/10", "8/10", "8/10"], weight: ["10", "5", "5"], rep: ["5", "6", "5"], note: "" },
                        { name: "ALZATE LATERALI SEDUTO", target: ["10", "10", "10", "10"], weight: ["5", "5", "5", "5"], rep: ["10", "11", "10", "8"], note: "" },
                        { name: "SHOULDER PRESS", target: ["8", "8", "6"], weight: ["20", "20", "25"], rep: ["8", "8", "6"], note: "" }
                    ]
                },
                {
                    name: "GIORNO 3",
                    exercises: [
                        { name: "LAT MACHINE CON TRIANGOLO", target: ["6/8", "6/8", "6/8", "6/8"], weight: ["35", "40", "40", "35"], rep: ["8", "6", "5", "6"], note: "" },
                        { name: "ROWING STRETTA", target: ["10", "8", "6"], weight: ["20", "20", "20"], rep: ["8", "8", "8"], note: "" },
                        { name: "PULLEY", target: ["8/10", "8/10", "8/10", "8/10"], weight: ["25+20", "20", "20", "20"], rep: ["5+3", "9", "7", "8"], note: "" },
                        { name: "PECK BACK", target: ["10", "10", "10"], weight: ["27.5", "27.5", "27.5"], rep: ["8", "7", "8"], note: "" },
                        { name: "FRENCH PRESS BILANC. STESO", target: ["8", "8", "8"], weight: ["7.5", "7.5", "5"], rep: ["7", "5", "8"], note: "" },
                        { name: "PUSH DOWN CON FUNE", target: ["8", "8", "8"], weight: ["15+10", "10", "10"], rep: ["5+5", "9", "8"], note: "" }
                    ]
                },
                {
                    name: "GIORNO 4",
                    exercises: [
                        { name: "PEC FLY", target: ["10", "10", "10"], weight: ["27.5", "27.5", "27.5"], rep: ["8", "8", "7"], note: "" },
                        { name: "PANCA 30° AL MULTIPOWER", target: ["10", "8", "6"], weight: ["2.5", "2.5", "2.5"], rep: ["N/A", "N/A", "N/A"], note: "" },
                        { name: "REMATORE BILANC PRESA INVERSA", target: ["10", "8", "6"], weight: ["15", "15", "15"], rep: ["10", "10", "10"], note: "" },
                        { name: "CURL MARTELLO IN PIEDI + PUSH DOWN CON ASTA CURVA", target: ["8", "8", "8"], weight: ["5+30", "5+30", "5+30"], rep: ["10+8", "10+8", "10+7"], note: "" },
                        { name: "HACK SQUAT", target: ["8/10", "8/10", "8/10"], weight: ["VUOTO", "VUOTO", "VUOTO"], rep: ["6", "6", "6"], note: "" },
                        { name: "AFFONDI SUL POSTO", target: ["10", "10", "10"], weight: ["N/A", "N/A", "N/A"], rep: ["N/A", "N/A", "N/A"], note: "" }
                    ]
                }
            ]
        };

        // App State
        let appState = {
            schede: [],
            routines: [],
            lastUsedSchedaId: null,
            currentView: 'home', // 'home', 'routine-detail', 'archive', 'schede-list', 'scheda-builder', 'scheda-select'
            currentRoutineId: null,
            currentDayIndex: 0,
            archiveSortOrder: 'desc',
            
            // Temporary builder state for creating/editing a Scheda
            builderScheda: null,
            builderCurrentDay: 0,
            deleteExerciseMode: false
        };

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderApp();
            lucide.createIcons();
        });

        function loadFromLocalStorage() {
            const savedSchede = localStorage.getItem('gt_schede_v2');
            const savedRoutines = localStorage.getItem('gt_routines_v2');
            const savedLastScheda = localStorage.getItem('gt_last_scheda_id');

            if (savedSchede) {
                try { appState.schede = JSON.parse(savedSchede); } catch(e) { appState.schede = []; }
            }
            if (!appState.schede || appState.schede.length === 0) {
                appState.schede = [JSON.parse(JSON.stringify(DEFAULT_SCHEDA))];
            }

            if (savedRoutines) {
                try { appState.routines = JSON.parse(savedRoutines); } catch(e) { appState.routines = []; }
            }
            if (!appState.routines || appState.routines.length === 0) {
                appState.routines = [JSON.parse(JSON.stringify(INITIAL_ROUTINE_COMPLETED))];
            }

            // Ensure notes field exists in older saved entries
            appState.routines.forEach(r => {
                r.days.forEach(d => {
                    d.exercises.forEach(ex => {
                        if (ex.note === undefined) ex.note = "";
                    });
                });
            });

            appState.lastUsedSchedaId = savedLastScheda || appState.schede[0].id;
            saveToLocalStorage();
        }

        function saveToLocalStorage() {
            localStorage.setItem('gt_schede_v2', JSON.stringify(appState.schede));
            localStorage.setItem('gt_routines_v2', JSON.stringify(appState.routines));
            if (appState.lastUsedSchedaId) {
                localStorage.setItem('gt_last_scheda_id', appState.lastUsedSchedaId);
            }
        }

        function isDayComplete(day) {
            return day.exercises.every(ex => {
                for (let i = 0; i < ex.target.length; i++) {
                    if (!ex.weight[i] || ex.weight[i].toString().trim() === "" ||
                        !ex.rep[i] || ex.rep[i].toString().trim() === "") {
                        return false;
                    }
                }
                return true;
            });
        }

        function isRoutineComplete(routine) {
            return routine.days.every(day => isDayComplete(day));
        }

        function getActiveIncompleteRoutine() {
            const sorted = [...appState.routines].sort((a,b) => new Date(b.createdDate) - new Date(a.createdDate));
            return sorted.find(r => !isRoutineComplete(r));
        }

        function getNextIncompleteDayIndex(routine) {
            if (!routine) return 0;
            for (let i = 0; i < routine.days.length; i++) {
                if (!isDayComplete(routine.days[i])) return i;
            }
            return 0;
        }

        function navigateTo(view, params = {}) {
            appState.currentView = view;
            if (params.routineId) appState.currentRoutineId = params.routineId;
            if (params.dayIndex !== undefined) appState.currentDayIndex = params.dayIndex;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderApp() {
            const mainContent = document.getElementById('main-content');
            const headerActions = document.getElementById('header-actions');
            mainContent.innerHTML = '';
            headerActions.innerHTML = '';

            switch (appState.currentView) {
                case 'home':
                    renderHomeView(mainContent, headerActions);
                    break;
                case 'scheda-select':
                    renderSchedaSelectView(mainContent, headerActions);
                    break;
                case 'schede-list':
                    renderSchedeListView(mainContent, headerActions);
                    break;
                case 'scheda-builder':
                    renderSchedaBuilderView(mainContent, headerActions);
                    break;
                case 'routine-detail':
                    renderRoutineDetailView(mainContent, headerActions);
                    break;
                case 'archive':
                    renderArchiveView(mainContent, headerActions);
                    break;
            }

            lucide.createIcons();
        }

        // =========================================================================
        // VIEW: HOME SCREEN
        // =========================================================================
        function renderHomeView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="navigateTo('archive')" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-semibold">
                    <i data-lucide="archive" class="w-4 h-4"></i>
                    <span>Archivio</span>
                </button>
            `;

            const activeRoutine = getActiveIncompleteRoutine();
            const isIncomplete = !!activeRoutine;
            const nextDayIdx = isIncomplete ? getNextIncompleteDayIndex(activeRoutine) : 0;

            container.innerHTML = `
                <div class="space-y-5 animate-fade-in">
                    
                    <div class="p-5 rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 border border-slate-800 shadow-xl relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                        <div class="relative z-10 space-y-4">
                            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-500 text-xs font-medium">
                                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                                <span>Allenamento GymTrack</span>
                            </div>
                            <h2 class="text-2xl font-black text-white tracking-tight">Cosa vuoi fare oggi?</h2>
                            
                            <button onclick="navigateTo('scheda-select')" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-brand-500 to-emerald-500 hover:from-brand-600 hover:to-emerald-600 text-slate-950 font-extrabold flex items-center justify-center space-x-2 shadow-lg shadow-brand-500/20 transition active:scale-[0.98]">
                                <i data-lucide="play-circle" class="w-5 h-5"></i>
                                <span>Nuova Routine</span>
                            </button>
                        </div>
                    </div>

                    ${isIncomplete ? `
                        <div class="p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-transparent border border-amber-500/30 shadow-lg space-y-3">
                            <div class="flex items-start justify-between">
                                <div class="space-y-0.5">
                                    <span class="text-[10px] font-black uppercase tracking-wider text-amber-400">Allenamento In Corso</span>
                                    <h3 class="text-base font-bold text-white">${escapeHtml(activeRoutine.title)}</h3>
                                    <p class="text-xs text-slate-300">
                                        Prossimo: <strong class="text-brand-500">${escapeHtml(activeRoutine.days[nextDayIdx].name)}</strong>
                                    </p>
                                </div>
                                <span class="p-2 rounded-xl bg-amber-500/20 text-amber-400">
                                    <i data-lucide="flame" class="w-5 h-5"></i>
                                </span>
                            </div>

                            <div class="grid grid-cols-1 gap-2 pt-1">
                                <button onclick="navigateTo('routine-detail', { routineId: '${activeRoutine.id}', dayIndex: ${nextDayIdx} })" class="w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center justify-center space-x-2 transition active:scale-[0.98]">
                                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                                    <span>Continua Allenamento</span>
                                </button>
                                <button onclick="confirmTerminateWorkout('${activeRoutine.id}')" class="w-full py-2 px-4 rounded-xl bg-red-950/60 hover:bg-red-900/60 border border-red-800/50 text-red-400 font-semibold text-xs flex items-center justify-center space-x-1.5 transition">
                                    <i data-lucide="stop-circle" class="w-4 h-4"></i>
                                    <span>Interrompi Allenamento</span>
                                </button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="navigateTo('schede-list')" class="p-4 rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 text-left transition flex flex-col justify-between space-y-3 group">
                            <div class="p-2.5 rounded-xl bg-slate-800 text-brand-500 w-max group-hover:bg-brand-500 group-hover:text-slate-950 transition">
                                <i data-lucide="file-plus-2" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-white">Gestione Schede</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">Crea, modifica ed elimina modelli</p>
                            </div>
                        </button>

                        <button onclick="navigateTo('archive')" class="p-4 rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 text-left transition flex flex-col justify-between space-y-3 group">
                            <div class="p-2.5 rounded-xl bg-slate-800 text-emerald-400 w-max group-hover:bg-emerald-400 group-hover:text-slate-950 transition">
                                <i data-lucide="history" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-white">Archivio Routine</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">${appState.routines.length} allenamenti registrati</p>
                            </div>
                        </button>
                    </div>

                </div>
            `;
        }

        function confirmTerminateWorkout(routineId) {
            showModal("Interrompi Allenamento", "Tutti i campi rimasti vuoti verranno compilati con N/A e l'allenamento verrà segnato come terminato. Continuare?", () => {
                terminateWorkout(routineId);
            });
        }

        function terminateWorkout(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            routine.days.forEach(d => {
                d.exercises.forEach(ex => {
                    for (let i = 0; i < ex.target.length; i++) {
                        if (!ex.weight[i] || ex.weight[i].toString().trim() === "") {
                            ex.weight[i] = "N/A";
                        }
                        if (!ex.rep[i] || ex.rep[i].toString().trim() === "") {
                            ex.rep[i] = "N/A";
                        }
                    }
                });
            });

            saveToLocalStorage();
            showToast("Allenamento terminato e salvato!");
            navigateTo('home');
        }

        // =========================================================================

        function startRoutineFromScheda(schedaId) {
            const scheda = appState.schede.find(s => s.id === schedaId);
            if (!scheda) return;

            const todayStr = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
            const titleFormatted = `Routine ${scheda.title} (${todayStr})`;

            const newRoutine = {
                id: `routine_${Date.now()}`,
                title: titleFormatted,
                createdDate: new Date().toISOString(),
                schedaId: scheda.id,
                days: scheda.days.map(day => ({
                    name: day.name,
                    exercises: day.exercises.map(ex => ({
                        name: ex.name,
                        target: [...ex.target],
                        weight: new Array(ex.target.length).fill(""),
                        rep: new Array(ex.target.length).fill(""),
                        note: ""
                    }))
                }))
            };

            appState.routines.unshift(newRoutine);
            appState.lastUsedSchedaId = scheda.id;
            saveToLocalStorage();
            showToast("Nuova routine avviata!");
            navigateTo('routine-detail', { routineId: newRoutine.id, dayIndex: 0 });
        }

        function confirmDeleteScheda(schedaId) {
            if (appState.schede.length <= 1) {
                showToast("Devi mantenere almeno una scheda salvata!");
                return;
            }
            showModal("Elimina Scheda", "Sei sicuro di voler eliminare questo modello di scheda?", () => {
                appState.schede = appState.schede.filter(s => s.id !== schedaId);
                if (appState.lastUsedSchedaId === schedaId) {
                    appState.lastUsedSchedaId = appState.schede[0].id;
                }
                saveToLocalStorage();
                showToast("Scheda eliminata!");
                renderApp();
            });
        }

        // =========================================================================

            if (schedaToEdit) {
                appState.builderScheda = JSON.parse(JSON.stringify(schedaToEdit));

                appState.builderScheda = {
                    id: `scheda_${Date.now()}`,

                    days: [
                        { name: "GIORNO 1", exercises: [] },
                        { name: "GIORNO 2", exercises: [] },
                        { name: "GIORNO 3", exercises: [] },
                        { name: "GIORNO 4", exercises: [] }

            appState.deleteExerciseMode = false;
            navigateTo('scheda-builder');

            if (target) startSchedaBuilder(target);
        }

        function setBuilderDay(idx) {
            appState.builderCurrentDay = idx;
            appState.deleteExerciseMode = false;
            renderApp();
        }

        function updateBuilderDayName(dayIdx, newName) {
            if (newName.trim() !== "") {
                appState.builderScheda.days[dayIdx].name = newName.trim();
            }
        }

        function changeBuilderDayCount(delta) {
            const days = appState.builderScheda.days;
            const newCount = days.length + delta;
            if (newCount < 1 || newCount > 7) return;

            if (delta > 0) {
                days.push({ name: `GIORNO ${newCount}`, exercises: [] });
            } else {
                days.pop();
                if (appState.builderCurrentDay >= newCount) {
                    appState.builderCurrentDay = newCount - 1;
                }
            }
            renderApp();
        }

        function toggleDeleteBuilderExerciseMode() {
            appState.deleteExerciseMode = !appState.deleteExerciseMode;
            renderApp();
        }

        function confirmRemoveBuilderExercise(exIdx) {
            showModal("Elimina Esercizio", "Sei sicuro di voler eliminare questo esercizio?", () => {
                appState.builderScheda.days[appState.builderCurrentDay].exercises.splice(exIdx, 1);
                appState.deleteExerciseMode = false;
                renderApp();
            });
        }

        function cancelSchedaBuilder() {
            appState.builderScheda = null;
            navigateTo('schede-list');
        }

        function saveSchedaBuilder() {
            const scheda = appState.builderScheda;
            if (!scheda.title.trim()) {
                showToast("Inserisci un titolo per la scheda!");
                return;
            }

            const existingIdx = appState.schede.findIndex(s => s.id === scheda.id);
            if (existingIdx >= 0) {
                appState.schede[existingIdx] = scheda;
            } else {
                appState.schede.push(scheda);
            }

            saveToLocalStorage();
            showToast("Scheda salvata!");
            appState.builderScheda = null;
            navigateTo('schede-list');
        }

                        </button>

                        <button onclick="downloadDocx('${routine.id}')" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-brand-500 font-bold text-xs flex items-center space-x-2 transition border border-slate-700">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>Scarica .docx</span>
                        </button>
                    </div>

                </div>
            `;

            const swipeElement = document.getElementById('swipe-container');
            if (swipeElement) {
                swipeElement.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
                swipeElement.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipeGesture(); }, { passive: true });
            }
        }

        function handleSwipeGesture() {
            const threshold = 60;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > threshold) {
                if (diff < 0) navigateRoutineSwipe('left');
                else navigateRoutineSwipe('right');
            }
        }

        function navigateRoutineSwipe(direction) {
            const sortedRoutines = [...appState.routines].sort((a,b) => new Date(b.createdDate) - new Date(a.createdDate));
            const rIndex = sortedRoutines.findIndex(r => r.id === appState.currentRoutineId);
            
            let targetRoutine = null;
            if (direction === 'left' && rIndex > 0) targetRoutine = sortedRoutines[rIndex - 1];
            else if (direction === 'right' && rIndex < sortedRoutines.length - 1) targetRoutine = sortedRoutines[rIndex + 1];

            if (targetRoutine) {
                const cardBody = document.getElementById('routine-card-body');
                if (cardBody) {
                    cardBody.style.transform = direction === 'left' ? 'translateX(-100px)' : 'translateX(100px)';
                    cardBody.style.opacity = '0';
                }
                setTimeout(() => {
                    appState.currentRoutineId = targetRoutine.id;
                    renderApp();
                }, 150);
            }
        }

        function switchDay(index) {
            appState.currentDayIndex = index;
            renderApp();
        }

        function updateRoutineTitle(routineId, newTitle) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine && newTitle.trim() !== "") {
                routine.title = newTitle.trim();
                saveToLocalStorage();
                showToast("Titolo aggiornato!");
            }
        }

        function updateExerciseData(routineId, dayIdx, exIdx, field, setIdx, value) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine) {
                routine.days[dayIdx].exercises[exIdx][field][setIdx] = value;
                saveToLocalStorage();
            }
        }

        function updateExerciseNote(routineId, dayIdx, exIdx, noteValue) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine) {
                routine.days[dayIdx].exercises[exIdx].note = noteValue;
                saveToLocalStorage();
            }
        }

        function confirmDeleteRoutine(routineId) {
            showModal("Elimina Routine", "Sei sicuro di voler eliminare definitivamente questa scheda?", () => {
                appState.routines = appState.routines.filter(r => r.id !== routineId);
                saveToLocalStorage();
                showToast("Routine eliminata!");
                navigateTo('home');
            });
        }

        // Active Exercise Editor Modal
        function openEditActiveExerciseModal(routineId, dayIdx, exIdx) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            const ex = routine.days[dayIdx].exercises[exIdx];
            openExerciseEditorModal(ex, (updatedEx) => {
                // Adjust weight and rep arrays according to new series count
                const newLength = updatedEx.target.length;
                const newWeight = [];
                const newRep = [];
                for (let i = 0; i < newLength; i++) {
                    newWeight.push(ex.weight[i] !== undefined ? ex.weight[i] : "");
                    newRep.push(ex.rep[i] !== undefined ? ex.rep[i] : "");
                }

                ex.name = updatedEx.name;
                ex.target = updatedEx.target;
                ex.weight = newWeight;
                ex.rep = newRep;

                saveToLocalStorage();
                showToast("Esercizio aggiornato!");
                renderApp();
            });
        }


        // =========================================================================
        // VIEW: ARCHIVIO (STORICO ROUTINE)
        // =========================================================================
        function renderArchiveView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="navigateTo('home')" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </button>
            `;

            const sorted = [...appState.routines].sort((a,b) => {
                const dateA = new Date(a.createdDate);
                const dateB = new Date(b.createdDate);
                return appState.archiveSortOrder === 'desc' ? dateB - dateA : dateA - dateB;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-black text-white">Archivio Routine</h2>
                            <p class="text-xs text-slate-400">Tutti gli allenamenti registrati</p>
                        </div>
                        <button onclick="toggleSortOrder()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-brand-500 flex items-center space-x-1.5">
                            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i>
                            <span>${appState.archiveSortOrder === 'desc' ? 'Più recenti' : 'Meno recenti'}</span>
                        </button>
                    </div>

                    <div class="space-y-3">
                        ${sorted.map(routine => {
                            const isComplete = isRoutineComplete(routine);
                            const completedDays = routine.days.filter(d => isDayComplete(d)).length;

                            return `
                                <div onclick="navigateTo('routine-detail', { routineId: '${routine.id}', dayIndex: 0 })" class="p-4 rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition cursor-pointer shadow-md space-y-3 group">
                                    <div class="flex items-start justify-between">
                                        <div class="space-y-0.5">
                                            <h3 class="font-bold text-white text-base group-hover:text-brand-500 transition">${escapeHtml(routine.title)}</h3>
                                            <span class="text-xs text-slate-400 block">
                                                Creato il ${new Date(routine.createdDate).toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' })}
                                            </span>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider ${isComplete ? 'bg-brand-500/10 text-brand-500 border border-brand-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'}">
                                            ${isComplete ? 'Completata' : 'In corso'}
                                        </span>
                                    </div>

                                    <div class="space-y-1.5">
                                        <div class="flex justify-between text-[11px] font-semibold text-slate-400">
                                            <span>Avanzamento Giorni</span>
                                            <span>${completedDays} / ${routine.days.length} Giorni</span>
                                        </div>
                                        <div class="w-full h-2 rounded-full bg-slate-950 overflow-hidden flex gap-1 p-0.5 border border-slate-800">
                                            ${routine.days.map(d => `
                                                <div class="h-full flex-1 rounded-full ${isDayComplete(d) ? 'bg-brand-500' : 'bg-slate-800'}"></div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleSortOrder() {
            appState.archiveSortOrder = appState.archiveSortOrder === 'desc' ? 'asc' : 'desc';
            renderApp();
        }


        // =========================================================================
        // GENERIC EXERCISE EDITOR MODAL
        // =========================================================================
        function openExerciseEditorModal(existingExercise, onSaveCallback) {
            const isEdit = !!existingExercise;
            let currentSetCount = isEdit ? existingExercise.target.length : 3;
            let currentTargets = isEdit ? [...existingExercise.target] : ["10", "10", "10"];
            let nameVal = isEdit ? existingExercise.name : "";

            const backdrop = document.getElementById('dynamic-modal-backdrop');
            const content = document.getElementById('dynamic-modal-content');

            function renderModal() {
                // Ensure array matches count
                while (currentTargets.length < currentSetCount) currentTargets.push("10");
                while (currentTargets.length > currentSetCount) currentTargets.pop();

                content.innerHTML = `
                    <h3 class="text-lg font-bold text-white">${isEdit ? 'Modifica Esercizio' : 'Nuovo Esercizio'}</h3>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="text-slate-400 font-semibold block mb-1">Nome Esercizio</label>
                            <input id="modal-ex-name" type="text" value="${escapeHtml(nameVal)}" placeholder="Es. Panca Piana" 
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white focus:border-brand-500 focus:outline-none" />
                        </div>

                        <div class="flex items-center justify-between">
                            <label class="text-slate-400 font-semibold">Numero di Serie (Colonne)</label>
                            <div class="flex items-center space-x-2">
                                <button id="btn-sets-dec" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white hover:bg-slate-700">-</button>
                                <span class="font-bold text-sm text-white w-5 text-center">${currentSetCount}</span>
                                <button id="btn-sets-inc" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white hover:bg-slate-700">+</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-slate-400 font-semibold block">Obiettivo Rep per Serie</label>
                            <div class="grid grid-cols-3 gap-2">
                                ${currentTargets.map((t, idx) => `
                                    <div>
                                        <span class="text-[10px] text-slate-500 block mb-0.5">SET ${idx+1}</span>
                                        <input type="text" value="${escapeHtml(t)}" data-idx="${idx}" class="modal-target-input w-full py-1 px-2 text-center bg-slate-950 border border-slate-800 rounded-lg text-amber-400 font-mono font-bold focus:border-brand-500 focus:outline-none" />
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 justify-end pt-3 border-t border-slate-800">
                        <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">Annulla</button>
                        <button id="modal-save-btn" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-slate-950 text-xs font-bold">Salva</button>
                    </div>
                `;

                // Attach Listeners
                document.getElementById('modal-ex-name').oninput = (e) => { nameVal = e.target.value; };
                
                document.querySelectorAll('.modal-target-input').forEach(inp => {
                    inp.oninput = (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        currentTargets[idx] = e.target.value;
                    };
                });

                document.getElementById('btn-sets-dec').onclick = () => {
                    if (currentSetCount > 1) {
                        currentSetCount--;
                        renderModal();
                    }
                };

                document.getElementById('btn-sets-inc').onclick = () => {
                    if (currentSetCount < 10) {
                        currentSetCount++;
                        renderModal();
                    }
                };

                document.getElementById('modal-cancel-btn').onclick = () => {
                    backdrop.classList.add('hidden');
                };

                document.getElementById('modal-save-btn').onclick = () => {
                    if (!nameVal.trim()) {
                        showToast("Inserisci il nome dell'esercizio!");
                        return;
                    }
                    backdrop.classList.add('hidden');
                    onSaveCallback({
                        name: nameVal.trim(),
                        target: [...currentTargets]
                    });
                };
            }

            renderModal();
            backdrop.classList.remove('hidden');
        }


        // =========================================================================
        // WORD (.DOCX) EXPORT IMPLEMENTATION
        // =========================================================================
        function downloadDocx(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            showToast("Generazione file Word in corso...");

            try {
                const docxLib = window.docx;
                const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun, HeadingLevel, AlignmentType } = docxLib;

                const docChildren = [];

                docChildren.push(
                    new Paragraph({
                        text: routine.title.toUpperCase(),
                        heading: HeadingLevel.HEADING_1,
                        alignment: AlignmentType.CENTER,
                        spacing: { after: 300 }
                    })
                );

                routine.days.forEach((day) => {
                    docChildren.push(
                        new Paragraph({
                            text: day.name,
                            heading: HeadingLevel.HEADING_2,
                            spacing: { before: 200, after: 150 }
                        })
                    );

                    day.exercises.forEach((ex) => {
                        docChildren.push(
                            new Paragraph({
                                children: [
                                    new TextRun({ text: ex.name, bold: true, size: 22 })
                                ],
                                spacing: { before: 100, after: 80 }
                            })
                        );

                        const headerCells = [
                            new TableCell({
                                children: [new Paragraph({ children: [new TextRun({ text: "OBIETTIVO", bold: true })] })],
                                width: { size: 25, type: WidthType.PERCENTAGE }
                            })
                        ];
                        ex.target.forEach((t) => {
                            headerCells.push(
                                new TableCell({
                                    children: [new Paragraph({ children: [new TextRun({ text: t, bold: true })], alignment: AlignmentType.CENTER })],
                                    width: { size: 75 / ex.target.length, type: WidthType.PERCENTAGE }
                                })
                            );
                        });

                        const pesoCells = [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "PESO", bold: true })] })] })
                        ];
                        ex.weight.forEach((w) => {
                            pesoCells.push(
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: w || "" })], alignment: AlignmentType.CENTER })] })
                            );
                        });

                        const repCells = [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "REP", bold: true })] })] })
                        ];
                        ex.rep.forEach((r) => {
                            repCells.push(
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: r || "" })], alignment: AlignmentType.CENTER })] })
                            );
                        });

                        const table = new Table({
                            rows: [
                                new TableRow({ children: headerCells }),
                                new TableRow({ children: pesoCells }),
                                new TableRow({ children: repCells })
                            ],
                            width: { size: 100, type: WidthType.PERCENTAGE }
                        });

                        docChildren.push(table);

                        if (ex.note && ex.note.trim()) {
                            docChildren.push(
                                new Paragraph({
                                    children: [
                                        new TextRun({ text: `Note: ${ex.note}`, italic: true, size: 18 })
                                    ],
                                    spacing: { before: 60, after: 100 }
                                })
                            );
                        } else {
                            docChildren.push(new Paragraph({ text: "", spacing: { after: 120 } }));
                        }
                    });
                });

                const doc = new Document({
                    sections: [{ properties: {}, children: docChildren }]
                });

                Packer.toBlob(doc).then((blob) => {
                    const fileName = `${routine.title.replace(/[^a-zA-Z0-9\s]/g, '')}.docx`;
                    saveAs(blob, fileName);
                    showToast("Download avviato!");
                });

            } catch (err) {
                console.error("DOCX error:", err);
                showToast("Errore nella creazione del file Word.");
            }
        }


        // =========================================================================
        // UTILS
        // =========================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        let modalCallback = null;
        function showModal(title, body, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            modalCallback = onConfirm;
            document.getElementById('modal-backdrop').classList.remove('hidden');

            document.getElementById('modal-confirm-btn').onclick = () => {
                if (modalCallback) modalCallback();
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
            modalCallback = null;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
