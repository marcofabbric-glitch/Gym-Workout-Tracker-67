<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker - Scheda Allenamento & Social</title>
    <link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon.png">
	<link rel="icon" type="image/png" href="icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e6fef0',
                            100: '#c2fbd7',
                            500: '#00E676',
                            600: '#00c853',
                            700: '#00a340',
                            900: '#004d1a',
                            accent: '#eab308'
                        },
                        dark: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            border: '#2a2a2a',
                            input: '#121212'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- docx library for Word Export -->
    <script src="https://unpkg.com/docx@8.2.3/build/index.umd.js"></script>
    <!-- FileSaver for triggering downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .swipe-card {
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            will-change: transform, opacity;
        }
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            touch-action: pan-y;
            background-color: #121212;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .last-used-glow {
            border: 2px solid #00E676 !important;
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.4) !important;
        }
    </style>
</head>
<body class="min-h-screen pb-16 flex flex-col items-center justify-start antialiased selection:bg-brand-500 selection:text-black">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md min-h-screen flex flex-col bg-slate-950 shadow-2xl relative overflow-x-hidden border-x border-slate-800">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
                <div class="p-2 bg-gradient-to-tr from-brand-600 to-emerald-400 rounded-xl text-slate-950 font-black shadow-lg shadow-brand-500/20">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-black tracking-tight text-lg text-white leading-none">GYM<span class="text-brand-500">TRACK</span></h1>
                    <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Schede & Social</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-2"></div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto"></main>

        <!-- Toast Notifications -->
        <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-brand-500 text-slate-950 font-bold px-4 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
            <span id="toast-message" class="text-sm">Notifica</span>
        </div>

        <!-- Generic Confirm Modal -->
        <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl space-y-4">
                <h3 id="modal-title" class="text-lg font-bold text-white">Conferma Azione</h3>
                <p id="modal-body" class="text-sm text-slate-400">Sei sicuro di voler procedere?</p>
                <div class="flex items-center space-x-2 justify-end pt-2">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition">Annulla</button>
                    <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Conferma</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Modal (For exercise editing / inputs / Supabase Config) -->
        <div id="dynamic-modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div id="dynamic-modal-content" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2 z-40 flex items-center justify-around">
            <button onclick="navigateTo('home')" id="nav-btn-home" class="flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-brand-500 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            
            <button onclick="navigateTo('friends')" id="nav-btn-friends" class="flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-brand-500 transition">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Amici</span>
            </button>
            
            <button onclick="handleProfileNavClick()" id="nav-btn-profile" class="flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-brand-500 transition">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span id="nav-label-profile" class="text-[10px] font-bold">Profilo</span>
            </button>
        </nav>

    </div>

    <script>
        const DEFAULT_SCHEDA = null;
        const INITIAL_ROUTINE_COMPLETED = null;

        let supabaseClient = null;
        let currentUser = null;
        let currentProfile = null;
        let isSignUpMode = false;

        let appState = {
            schede: [],
            routines: [],
            lastUsedSchedaId: null,
            currentView: 'home',
            currentRoutineId: null,
            currentDayIndex: 0,
            archiveSortOrder: 'desc',
            
            builderScheda: null,
            builderCurrentDay: 0,
            deleteExerciseMode: false
        };

        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            initSupabase();
            renderApp();
            lucide.createIcons();
        });

        function handleProfileNavClick() {
            if (currentUser) {
                navigateTo('profile');
            } else {
                navigateTo('auth');
            }
        }

        function updateBottomNavActiveState() {
            const btnHome = document.getElementById('nav-btn-home');
            const btnFriends = document.getElementById('nav-btn-friends');
            const btnProfile = document.getElementById('nav-btn-profile');
            const labelProfile = document.getElementById('nav-label-profile');

            if (!btnHome || !btnFriends || !btnProfile) return;

            [btnHome, btnFriends, btnProfile].forEach(btn => {
                btn.className = "flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-brand-500 transition";
            });

            if (labelProfile) {
                labelProfile.textContent = currentUser ? 'Profilo' : 'Login';
            }

            if (appState.currentView === 'home') {
                btnHome.className = "flex flex-col items-center justify-center space-y-1 text-brand-500 transition scale-105 font-bold";
            } else if (appState.currentView === 'friends') {
                btnFriends.className = "flex flex-col items-center justify-center space-y-1 text-brand-500 transition scale-105 font-bold";
            } else if (appState.currentView === 'auth' || appState.currentView === 'profile') {
                btnProfile.className = "flex flex-col items-center justify-center space-y-1 text-brand-500 transition scale-105 font-bold";
            }
        }

        function loadFromLocalStorage() {
            const savedSchede = localStorage.getItem('gt_schede_v2');
            const savedRoutines = localStorage.getItem('gt_routines_v2');
            const savedLastScheda = localStorage.getItem('gt_last_scheda_id');

            if (savedSchede) {
                try { appState.schede = JSON.parse(savedSchede); } catch(e) { appState.schede = []; }
            } else {
                appState.schede = [];
            }

            if (savedRoutines) {
                try { appState.routines = JSON.parse(savedRoutines); } catch(e) { appState.routines = []; }
            } else {
                appState.routines = [];
            }

            appState.routines.forEach(r => {
                r.days.forEach(d => {
                    d.exercises.forEach(ex => {
                        if (ex.note === undefined) ex.note = "";
                    });
                });
            });

            appState.lastUsedSchedaId = savedLastScheda || (appState.schede.length > 0 ? appState.schede[0].id : null);
            saveToLocalStorage();
        }

        function saveToLocalStorage() {
            localStorage.setItem('gt_schede_v2', JSON.stringify(appState.schede));
            localStorage.setItem('gt_routines_v2', JSON.stringify(appState.routines));
            if (appState.lastUsedSchedaId) {
                localStorage.setItem('gt_last_scheda_id', appState.lastUsedSchedaId);
            }
        }

        function initSupabase() {
            // Credenziali hardcoded fisse: niente più richieste manuali su nessun dispositivo!
            const url = "https://cbaortznsaewspofazyr.supabase.co";
            const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiYW9ydHpuc2Fld3Nwb2ZhenlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjg1OTIsImV4cCI6MjEwODgwNDU5Mn0.ocXjIteI_YENslMRkVVChtG0rMiWUZVCC8ZD9aqrTeY"; 

            if (window.supabase) {
                try {
                    supabaseClient = window.supabase.createClient(url, key);
                    checkSupabaseSession();
                } catch (e) {
                    console.warn("Errore inizializzazione Supabase", e);
                }
            }
        }

async function checkSupabaseSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await ensureUserProfileExists(); // <-- INCOLLALO QUI
                await syncDataFromCloud();
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    currentUser = session.user;
                    await ensureUserProfileExists(); // <-- E INCOLLALO ANCHE QUI
                    await syncDataFromCloud();
                } else {
                    currentUser = null;
                    currentProfile = null;
                }
                renderApp();
            });
        }

async function fetchUserProfile() {
            if (!supabaseClient || !currentUser) return;
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (data) {
                currentProfile = data;
                // Se il cloud ha un avatar salvato, lo salviamo in locale così l'app lo mostra subito!
                if (data.avatar_url) {
                    localStorage.setItem(`gt_avatar_${currentUser.id}`, data.avatar_url);
                }
            } else {
                const username = currentUser.email ? currentUser.email.split('@')[0] : 'User';
                const { data: newP } = await supabaseClient
                    .from('profiles')
                    .insert([{ id: currentUser.id, email: currentUser.email, username }])
                    .select()
                    .single();
                currentProfile = newP;
            }
        }
		
async function ensureUserProfileExists() {
            if (!supabaseClient || !currentUser) return;

            const { data: existingProfile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();

            if (!existingProfile) {
                const defaultUsername = currentUser.email ? currentUser.email.split('@')[0] : 'Atleta67';
                const { data: newProfile } = await supabaseClient
                    .from('profiles')
                    .insert([
                        { 
                            id: currentUser.id, 
                            username: defaultUsername,
                            avatar_url: localStorage.getItem(`gt_avatar_${currentUser.id}`) || null
                        }
                    ])
                    .select()
                    .single();

                if (newProfile) currentProfile = newProfile;
            } else {
                currentProfile = existingProfile;
                if (existingProfile.avatar_url) {
                    localStorage.setItem(`gt_avatar_${currentUser.id}`, existingProfile.avatar_url);
                }
            }
            renderApp();
        }
		
async function syncDataFromCloud() {
            if (!supabaseClient || !currentUser) return;
            
            // 1. Sincronizzazione Schede
            const { data: cloudSchede, error: errSch } = await supabaseClient
                .from('schede')
                .select('*')
                .eq('user_id', currentUser.id);

            if (cloudSchede && cloudSchede.length > 0) {
                appState.schede = cloudSchede.map(s => typeof s.content === 'string' ? JSON.parse(s.content) : s.content);
                saveToLocalStorage();
            } else if (appState.schede.length > 0) {
                // Se il cloud è vuoto ma il dispositivo ha schede, le carichiamo sul cloud!
                await syncSchedeToCloud();
            }

            // 2. Sincronizzazione Routine
            const { data: cloudRoutines, error: errRout } = await supabaseClient
                .from('routines')
                .select('*')
                .eq('user_id', currentUser.id);

            if (cloudRoutines && cloudRoutines.length > 0) {
                appState.routines = cloudRoutines.map(r => typeof r.content === 'string' ? JSON.parse(r.content) : r.content);
                saveToLocalStorage();
            } else if (appState.routines.length > 0) {
                // Se il cloud è vuoto ma il dispositivo ha routine, le carichiamo sul cloud!
                await syncRoutinesToCloud();
            }

            // 3. Sincronizzazione Profilo / Avatar
            await fetchUserProfile();

            renderApp();
            showToast("Sincronizzazione cloud completata!");
        }

        async function syncSchedeToCloud() {
            if (!supabaseClient || !currentUser) return;
            for (let s of appState.schede) {
                const { error } = await supabaseClient.from('schede').upsert({
                    id: s.id,
                    user_id: currentUser.id,
                    title: s.title,
                    content: s
                });
                if (error) console.error("Errore sync scheda cloud:", error);
            }
        }

        async function syncRoutinesToCloud() {
            if (!supabaseClient || !currentUser) return;
            for (let r of appState.routines) {
                const { error } = await supabaseClient.from('routines').upsert({
                    id: r.id,
                    user_id: currentUser.id,
                    title: r.title,
                    content: r
                });
                if (error) console.error("Errore sync routine cloud:", error);
            }
        }

        function isDayComplete(day) {
            return day.exercises.every(ex => {
                for (let i = 0; i < ex.target.length; i++) {
                    if (!ex.weight[i] || ex.weight[i].toString().trim() === "" ||
                        !ex.rep[i] || ex.rep[i].toString().trim() === "") {
                        return false;
                    }
                }
                return true;
            });
        }

        function isRoutineComplete(routine) {
            return routine.days.every(day => isDayComplete(day));
        }

        function getActiveIncompleteRoutine() {
            const sorted = [...appState.routines].sort((a,b) => new Date(b.createdDate) - new Date(a.createdDate));
            return sorted.find(r => !isRoutineComplete(r));
        }

        function getNextIncompleteDayIndex(routine) {
            if (!routine) return 0;
            for (let i = 0; i < routine.days.length; i++) {
                if (!isDayComplete(routine.days[i])) return i;
            }
            return 0;
        }

        function navigateTo(view, params = {}) {
            appState.currentView = view;
            if (params.routineId) appState.currentRoutineId = params.routineId;
            if (params.dayIndex !== undefined) appState.currentDayIndex = params.dayIndex;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderApp() {
            const mainContent = document.getElementById('main-content');
            const headerActions = document.getElementById('header-actions');
            
            if (!mainContent || !headerActions) return;

            mainContent.innerHTML = '';
            headerActions.innerHTML = '';

            switch (appState.currentView) {
                case 'home':
                    renderHomeView(mainContent, headerActions);
                    break;
                case 'scheda-select':
                    renderSchedaSelectView(mainContent, headerActions);
                    break;
                case 'schede-list':
                    renderSchedeListView(mainContent, headerActions);
                    break;
                case 'scheda-builder':
                    renderSchedaBuilderView(mainContent, headerActions);
                    break;
                case 'routine-detail':
                    renderRoutineDetailView(mainContent, headerActions);
                    break;
                case 'archive':
                    renderArchiveView(mainContent, headerActions);
                    break;
                case 'friends':
                    renderFriendsView(mainContent, headerActions);
                    break;
                case 'auth':
                    renderAuthView(mainContent, headerActions);
                    break;
                case 'profile':
                    renderProfileView(mainContent, headerActions);
                    break;
            }

            updateBottomNavActiveState();
            lucide.createIcons();
        }

        function renderProfileView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="navigateTo('home')" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </button>
            `;

            if (!currentUser) {
                navigateTo('auth');
                return;
            }

            const avatarUrl = currentProfile?.avatar_url || localStorage.getItem(`gt_avatar_${currentUser.id}`) || null;
            const username = currentProfile?.username || currentUser.email?.split('@')[0] || 'Atleta';
            const email = currentUser.email || '';

            const totalWorkouts = appState.routines.length;
            const completedWorkouts = appState.routines.filter(r => isRoutineComplete(r)).length;
            const totalSchede = appState.schede.length;

            container.innerHTML = `
                <div class="space-y-5 animate-fade-in pb-12">
                    
                    <div class="p-5 rounded-3xl bg-slate-900 border border-slate-800 flex flex-col items-center justify-center space-y-3 relative overflow-hidden shadow-xl">
                        <div class="relative group cursor-pointer" onclick="document.getElementById('avatar-file-input').click()">
                            <div class="w-20 h-20 rounded-full overflow-hidden bg-brand-500/20 border-2 border-brand-500 flex items-center justify-center text-brand-500 font-black text-2xl shadow-lg shadow-brand-500/20">
                                ${avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" class="w-full h-full object-cover" onerror="this.src=''" />` : username[0].toUpperCase()}
                            </div>
                            <div class="absolute inset-0 bg-slate-950/60 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                <i data-lucide="camera" class="w-5 h-5 text-white"></i>
                            </div>
                        </div>
                        <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="uploadAvatarImage(this)" />

                        <div class="text-center">
                            <h2 class="text-lg font-black text-white">${escapeHtml(username)}</h2>
                            <p class="text-xs text-slate-400">${escapeHtml(email)}</p>
                        </div>

                        <span class="px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-500 font-mono text-[10px] font-bold">
                            ACCOUNT CLOUD ATTIVO
                        </span>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-center">
                            <span class="block font-black text-lg text-brand-500">${totalWorkouts}</span>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase">Routine</span>
                        </div>
                        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-center">
                            <span class="block font-black text-lg text-emerald-400">${completedWorkouts}</span>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase">Completati</span>
                        </div>
                        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-center">
                            <span class="block font-black text-lg text-amber-400">${totalSchede}</span>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase">Schede</span>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                        <h3 class="text-xs font-bold text-brand-500 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                            <span>Dati Personali</span>
                        </h3>

                        <div class="space-y-3">
                            <div>
                                <label class="text-[11px] font-semibold text-slate-400 block mb-1">Username</label>
                                <div class="flex gap-2">
                                    <input type="text" id="prof-username" value="${escapeHtml(username)}" class="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                                    <button onclick="updateProfileUsername()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 font-bold text-xs rounded-xl">Aggiorna</button>
                                </div>
                            </div>

                            <div>
                                <label class="text-[11px] font-semibold text-slate-400 block mb-1">Email</label>
                                <div class="flex gap-2">
                                    <input type="email" id="prof-email" value="${escapeHtml(email)}" class="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                                    <button onclick="updateProfileEmail()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 font-bold text-xs rounded-xl">Aggiorna</button>
                                </div>
                            </div>

                            <div>
                                <label class="text-[11px] font-semibold text-slate-400 block mb-1">Nuova Password</label>
                                <div class="flex gap-2">
                                    <input type="password" id="prof-password" placeholder="Nuova password..." class="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                                    <button onclick="updateProfilePassword()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 font-bold text-xs rounded-xl">Cambia</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="settings" class="w-4 h-4"></i>
                            <span>Impostazioni & Sistema</span>

async function uploadAvatarImage(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxDim = 150;
                let w = img.width, h = img.height;
                if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
                else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                if (currentUser) {
                    localStorage.setItem(`gt_avatar_${currentUser.id}`, compressedBase64);
                    if (currentProfile) currentProfile.avatar_url = compressedBase64;
                    
                    if (supabaseClient) {
                        const { error } = await supabaseClient
                            .from('profiles')
                            .upsert({ 
                                id: currentUser.id, 
                                username: currentProfile?.username || currentUser.email.split('@')[0],
                                avatar_url: compressedBase64 
                            });

                        if (error) {
                            console.error("Errore salvataggio avatar su cloud:", error);
                            showToast("Errore cloud avatar: " + error.message);
                            return;
                        } else {
                            console.log("Avatar salvato e sincronizzato sul cloud con successo!");
                        }
                    }
                    
                    showToast("Foto profilo aggiornata e sincronizzata ovunque!");
                    renderApp();
                }
            };
        }

async function updateProfileUsername() {
            const newUsername = document.getElementById('prof-username').value.trim();
            if (!newUsername) return showToast("Inserisci un username valido!");
            if (!currentUser) return;

            if (supabaseClient) {
                // Proviamo l'update mirato per l'ID utente loggato
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .update({ username: newUsername })
                    .eq('id', currentUser.id)
                    .select();

                if (error) {
                    console.error("Errore Supabase:", error);
                    showToast("Errore Supabase: " + error.message);
                    return;
                }

                if (data && data.length > 0) {
                    currentProfile = data[0];
                } else {
                    // Se non ha aggiornato righe, forziamo l'inserimento
                    const { data: dataIns, error: errIns } = await supabaseClient
                        .from('profiles')
                        .upsert({ id: currentUser.id, email: currentUser.email, username: newUsername })
                        .select();
                    
                    if (errIns) {
                        console.error("Errore Upsert:", errIns);
                        showToast("Errore salvataggio cloud.");
                        return;
                    }
                    if (dataIns && dataIns.length > 0) currentProfile = dataIns[0];
                }
            }

            // Forza l'aggiornamento locale dell'input e dello stato
            if (currentProfile) currentProfile.username = newUsername;
            
            showToast("Username aggiornato con successo!");
            renderApp();
        }

        function terminateWorkout(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            routine.days.forEach(d => {
                d.exercises.forEach(ex => {
                    for (let i = 0; i < ex.target.length; i++) {
                        if (!ex.weight[i] || ex.weight[i].toString().trim() === "") {
                            ex.weight[i] = "N/A";
                        }
                        if (!ex.rep[i] || ex.rep[i].toString().trim() === "") {
                            ex.rep[i] = "N/A";
                        }
                    }
                });
            });

            saveToLocalStorage();
            syncRoutinesToCloud();
            showToast("Allenamento terminato e salvato!");
            navigateTo('home');
        }

        function setBuilderDay(idx) {
            appState.builderCurrentDay = idx;
            appState.deleteExerciseMode = false;
            renderApp();
        }

        function updateBuilderDayName(dayIdx, newName) {
            if (newName.trim() !== "") {
                appState.builderScheda.days[dayIdx].name = newName.trim();
            }
        }

        function changeBuilderDayCount(delta) {
            const days = appState.builderScheda.days;
            const newCount = days.length + delta;
            if (newCount < 1 || newCount > 7) return;

            if (delta > 0) {
                days.push({ name: `GIORNO ${newCount}`, exercises: [] });
            } else {
                days.pop();
                if (appState.builderCurrentDay >= newCount) {
                    appState.builderCurrentDay = newCount - 1;
                }
            }
            renderApp();
        }

        function toggleDeleteBuilderExerciseMode() {
            appState.deleteExerciseMode = !appState.deleteExerciseMode;
            renderApp();
        }

        function confirmRemoveBuilderExercise(exIdx) {
            showModal("Elimina Esercizio", "Sei sicuro di voler eliminare questo esercizio?", () => {
                appState.builderScheda.days[appState.builderCurrentDay].exercises.splice(exIdx, 1);
                appState.deleteExerciseMode = false;
                renderApp();
            });
        }

        function cancelSchedaBuilder() {
            appState.builderScheda = null;
            navigateTo('schede-list');
        }

        function saveSchedaBuilder() {
            const scheda = appState.builderScheda;
            if (!scheda.title.trim()) {
                showToast("Inserisci un titolo per la scheda!");
                return;
            }

            const existingIdx = appState.schede.findIndex(s => s.id === scheda.id);
            if (existingIdx >= 0) {
                appState.schede[existingIdx] = scheda;
            } else {
                appState.schede.push(scheda);
            }

            saveToLocalStorage();
            syncSchedeToCloud();
            showToast("Scheda salvata!");
            appState.builderScheda = null;
            navigateTo('schede-list');
        }

        function openAddBuilderExerciseModal() {
            openExerciseEditorModal(null, (newEx) => {
                appState.builderScheda.days[appState.builderCurrentDay].exercises.push(newEx);
                renderApp();
            });
        }

        function openEditBuilderExerciseModal(exIdx) {
            const currentEx = appState.builderScheda.days[appState.builderCurrentDay].exercises[exIdx];
            openExerciseEditorModal(currentEx, (updatedEx) => {
                appState.builderScheda.days[appState.builderCurrentDay].exercises[exIdx] = updatedEx;
                renderApp();
            });
        }

                swipeElement.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });

            }
        }

        function handleSwipeGesture() {
            const threshold = 60;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > threshold) {
                if (diff < 0) navigateRoutineSwipe('left');
                else navigateRoutineSwipe('right');
            }
        }

        function navigateRoutineSwipe(direction) {
            const sortedRoutines = [...appState.routines].sort((a,b) => new Date(b.createdDate) - new Date(a.createdDate));
            const rIndex = sortedRoutines.findIndex(r => r.id === appState.currentRoutineId);
            
            let targetRoutine = null;
            if (direction === 'left' && rIndex > 0) targetRoutine = sortedRoutines[rIndex - 1];
            else if (direction === 'right' && rIndex < sortedRoutines.length - 1) targetRoutine = sortedRoutines[rIndex + 1];

            if (targetRoutine) {
                const cardBody = document.getElementById('routine-card-body');
                if (cardBody) {
                    cardBody.style.transform = direction === 'left' ? 'translateX(-100px)' : 'translateX(100px)';
                    cardBody.style.opacity = '0';
                }
                setTimeout(() => {
                    appState.currentRoutineId = targetRoutine.id;
                    renderApp();
                }, 150);
            }
        }

        function switchDay(index) {
            appState.currentDayIndex = index;
            renderApp();
        }

        function updateRoutineTitle(routineId, newTitle) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine && newTitle.trim() !== "") {
                routine.title = newTitle.trim();
                saveToLocalStorage();
                syncRoutinesToCloud();
                showToast("Titolo aggiornato!");
            }
        }

        function updateExerciseData(routineId, dayIdx, exIdx, field, setIdx, value) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine) {
                routine.days[dayIdx].exercises[exIdx][field][setIdx] = value;
                saveToLocalStorage();
                syncRoutinesToCloud();
            }
        }

        function updateExerciseNote(routineId, dayIdx, exIdx, noteValue) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (routine) {
                routine.days[dayIdx].exercises[exIdx].note = noteValue;
                saveToLocalStorage();
                syncRoutinesToCloud();
            }
        }

        function confirmDeleteRoutine(routineId) {
            showModal("Elimina Routine", "Sei sicuro di voler eliminare definitivamente questa scheda?", async () => {
                appState.routines = appState.routines.filter(r => r.id !== routineId);
                saveToLocalStorage();
                if (supabaseClient && currentUser) {
                    await supabaseClient.from('routines').delete().eq('id', routineId);
                }
                showToast("Routine eliminata!");
                navigateTo('home');
            });
        }

        function openEditActiveExerciseModal(routineId, dayIdx, exIdx) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            const ex = routine.days[dayIdx].exercises[exIdx];
            openExerciseEditorModal(ex, (updatedEx) => {
                const newLength = updatedEx.target.length;
                const newWeight = [];
                const newRep = [];
                for (let i = 0; i < newLength; i++) {
                    newWeight.push(ex.weight[i] !== undefined ? ex.weight[i] : "");
                    newRep.push(ex.rep[i] !== undefined ? ex.rep[i] : "");
                }

                ex.name = updatedEx.name;
                ex.target = updatedEx.target;
                ex.weight = newWeight;
                ex.rep = newRep;

                saveToLocalStorage();
                syncRoutinesToCloud();
                showToast("Esercizio aggiornato!");
                renderApp();
            });
        }

                    </div>

                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">I Tuoi Amici</h3>
                        <div id="friends-list" class="space-y-2">
                            <div class="p-4 text-center text-xs text-slate-500">Caricamento amici...</div>
                        </div>
                    </div>

                    <div id="friend-schede-drawer" class="hidden p-4 rounded-2xl bg-slate-900 border border-brand-500/50 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h4 id="friend-schede-title" class="font-bold text-sm text-brand-500">Schede Amico</h4>
                            <button onclick="closeFriendSchedeDrawer()" class="text-xs text-red-400 font-bold">[Chiudi]</button>
                        </div>
                        <div id="friend-schede-list" class="space-y-2"></div>
                    </div>
                </div>
            `;

            loadFriendsData();
        }

        async function searchAndAddFriend() {
            const input = document.getElementById('input-search-username');
            const username = input.value.trim();
            if (!username) return;

            if (!supabaseClient || !currentUser) return;

            const { data: profiles } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', username);

            if (!profiles || profiles.length === 0) {
                showToast("Utente non trovato!");
                return;
            }

            const target = profiles[0];
            if (target.id === currentUser.id) {
                showToast("Non puoi aggiungere te stesso!");
                return;
            }

            const { error } = await supabaseClient
                .from('friendships')
                .insert([{ requester_id: currentUser.id, addressee_id: target.id, status: 'pending' }]);

            if (error) {
                showToast("Richiesta già inviata o esistente.");
            } else {
                showToast(`Richiesta inviata a ${target.username}!`);
                input.value = '';
            }
        }

        async function loadFriendsData() {
            if (!supabaseClient || !currentUser) return;

            const { data: pending } = await supabaseClient
                .from('friendships')
                .select('id, requester_id, profiles!friendships_requester_id_fkey(username)')
                .eq('addressee_id', currentUser.id)
                .eq('status', 'pending');

            const pendingCont = document.getElementById('pending-friends-container');
            const pendingList = document.getElementById('pending-friends-list');

            if (pending && pending.length > 0) {
                pendingCont.classList.remove('hidden');
                pendingList.innerHTML = pending.map(p => `
                    <div class="p-3 rounded-xl bg-slate-900 border border-amber-500/30 flex items-center justify-between text-xs">
                        <span class="font-bold text-slate-200">${escapeHtml(p.profiles?.username || 'Utente')}</span>
                        <div class="flex gap-2">
                            <button onclick="respondFriend('${p.id}', 'accepted')" class="px-2.5 py-1 rounded-lg bg-brand-500 text-slate-950 font-bold">Accetta</button>
                            <button onclick="respondFriend('${p.id}', 'rejected')" class="px-2.5 py-1 rounded-lg bg-red-600 text-white font-bold">Rifiuta</button>
                        </div>
                    </div>
                `).join('');
            } else {
                pendingCont.classList.add('hidden');
            }

            const { data: friendships } = await supabaseClient
                .from('friendships')
                .select('id, requester_id, addressee_id')
                .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`)
                .eq('status', 'accepted');

            const friendIds = [];
            if (friendships) {
                friendships.forEach(f => {
                    friendIds.push(f.requester_id === currentUser.id ? f.addressee_id : f.requester_id);
                });
            }

            const friendsList = document.getElementById('friends-list');
            if (friendIds.length === 0) {
                friendsList.innerHTML = `<p class="text-xs text-slate-500 italic p-2">Nessun amico ancora aggiunto.</p>`;
                return;
            }

            const { data: profiles } = await supabaseClient
                .from('profiles')
                .select('*')
                .in('id', friendIds);

            if (profiles) {
                friendsList.innerHTML = profiles.map(fp => `
                    <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                        <span class="font-bold text-sm text-white">${escapeHtml(fp.username)}</span>
                        <button onclick="fetchFriendSchede('${fp.id}', '${escapeHtml(fp.username)}')" class="py-1.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-brand-500 font-bold text-xs flex items-center space-x-1">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            <span>Vedi Schede</span>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        }

        async function respondFriend(id, status) {
            if (!supabaseClient) return;
            if (status === 'accepted') {
                await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', id);
            } else {
                await supabaseClient.from('friendships').delete().eq('id', id);
            }
            loadFriendsData();
        }

        async function fetchFriendSchede(friendId, friendUsername) {
            if (!supabaseClient) return;
            const drawer = document.getElementById('friend-schede-drawer');
            const title = document.getElementById('friend-schede-title');
            const list = document.getElementById('friend-schede-list');

            title.innerText = `Schede di ${friendUsername}`;
            drawer.classList.remove('hidden');

            const { data: schede } = await supabaseClient
                .from('schede')
                .select('*')
                .eq('user_id', friendId);

            if (!schede || schede.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 italic">L'utente non ha schede pubbliche.</p>`;
                return;
            }

            list.innerHTML = schede.map(s => {
                const sObj = typeof s.content === 'string' ? JSON.parse(s.content) : s.content;
                return `
                    <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                        <div>
                            <h5 class="font-bold text-xs text-white">${escapeHtml(sObj.title)}</h5>
                            <span class="text-[10px] text-slate-400">${sObj.days.length} Giorni</span>
                        </div>
                        <button onclick='cloneFriendScheda(${JSON.stringify(sObj)})' class="py-1.5 px-3 rounded-xl bg-brand-500 text-slate-950 font-bold text-xs">
                            Salva nelle mie Schede
                        </button>
                    </div>
                `;
            }).join('');
        }

        function closeFriendSchedeDrawer() {
            document.getElementById('friend-schede-drawer').classList.add('hidden');
        }

        function cloneFriendScheda(schedaObj) {
            const cloned = JSON.parse(JSON.stringify(schedaObj));
            cloned.id = `scheda_${Date.now()}`;
            cloned.title = `${cloned.title} (da Amico)`;

            appState.schede.push(cloned);
            saveToLocalStorage();
            syncSchedeToCloud();
            showToast("Scheda clonata con successo!");
            closeFriendSchedeDrawer();
            navigateTo('schede-list');
        }

        function renderAuthView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="navigateTo('home')" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.innerHTML = `
                <div class="space-y-5 p-2">
                    <div>
                        <h2 id="auth-header-title" class="text-xl font-black text-white">${isSignUpMode ? 'Crea Account' : 'Accedi al Cloud'}</h2>
                        <p class="text-xs text-slate-400">Sincronizza le tue schede e condividi con gli amici</p>
                    </div>

                    <form onsubmit="handleAuthSubmit(event)" class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                        ${isSignUpMode ? `
                            <div>
                                <label class="text-xs font-semibold text-slate-400">Username</label>
                                <input type="text" id="auth-username" required placeholder="Username" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                            </div>
                        ` : ''}

                        <div>
                            <label class="text-xs font-semibold text-slate-400">Email</label>
                            <input type="email" id="auth-email" required placeholder="user@domain.com" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                        </div>

                        <div>
                            <div class="flex items-center justify-between">
                                <label class="text-xs font-semibold text-slate-400">Password</label>
                                ${!isSignUpMode ? `
                                    <button type="button" onclick="openForgotPasswordModal()" class="text-[11px] text-brand-500 hover:underline font-semibold">
                                        Password dimenticata?
                                    </button>
                                ` : ''}
                            </div>
                            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-xs text-white focus:border-brand-500 focus:outline-none" />
                        </div>

                        <div class="flex items-center space-x-2 pt-1">
                            <input type="checkbox" id="auth-remember" checked class="accent-brand-500 rounded" />
                            <label for="auth-remember" class="text-xs text-slate-300 font-medium">Ricorda su questo dispositivo</label>
                        </div>

                        <button type="submit" class="w-full py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-slate-950 font-extrabold text-xs transition shadow-lg shadow-brand-500/20 mt-2">
                            ${isSignUpMode ? 'REGISTRATI' : 'ACCEDI'}
                        </button>
                    </form>

                    <div class="text-center pt-2">
                        <button onclick="toggleAuthMode()" class="text-xs text-brand-500 font-bold underline">
                            ${isSignUpMode ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati'}
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            renderApp();
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            if (!supabaseClient) return;

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const username = isSignUpMode ? document.getElementById('auth-username').value : '';

            try {
                if (isSignUpMode) {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { username } }
                    });
                    if (error) throw error;
                    if (data.user) {
                        await supabaseClient.from('profiles').upsert({ id: data.user.id, email, username });
                    }
                    showToast("Registrazione completata! Controlla la mail per verificare l'account.");
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showToast("Login effettuato!");
                }
                navigateTo('home');
            } catch (err) {
                showToast(err.message || "Errore autenticazione");
            }
        }

        async function logoutSupabase() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            currentUser = null;
            currentProfile = null;
            showToast("Logout effettuato!");
            navigateTo('home');
        }

        function openForgotPasswordModal() {
            const backdrop = document.getElementById('dynamic-modal-backdrop');
            const content = document.getElementById('dynamic-modal-content');

            content.innerHTML = `
                <h3 class="text-lg font-bold text-white">Recupero Password</h3>
                <p class="text-xs text-slate-400">Inserisci l'indirizzo email associato al tuo account per ricevere il link di reset.</p>

                <div class="space-y-3 text-xs pt-1">
                    <div>
                        <label class="text-slate-400 font-semibold block mb-1">Email Account</label>
                        <input id="reset-email" type="email" placeholder="user@domain.com" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold focus:border-brand-500 focus:outline-none" />
                    </div>
                </div>

                <div class="flex items-center space-x-2 justify-end pt-3 border-t border-slate-800">
                    <button onclick="document.getElementById('dynamic-modal-backdrop').classList.add('hidden')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Annulla</button>
                    <button onclick="sendPasswordResetEmail()" class="px-4 py-2 rounded-xl bg-brand-500 text-slate-950 text-xs font-bold">Invia Email</button>
                </div>
            `;
            backdrop.classList.remove('hidden');
        }

        async function sendPasswordResetEmail() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) return showToast("Inserisci un'email valida!");
            if (!supabaseClient) return;

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.href
            });

            document.getElementById('dynamic-modal-backdrop').classList.add('hidden');

            if (error) {
                showToast(error.message || "Errore durante l'invio del link.");
            } else {
                showToast("Email di reset inviata! Controlla la tua casella.");
            }
        }

        function openExerciseEditorModal(existingExercise, onSaveCallback) {
            const isEdit = !!existingExercise;
            let currentSetCount = isEdit ? existingExercise.target.length : 3;
            let currentTargets = isEdit ? [...existingExercise.target] : ["10", "10", "10"];
            let nameVal = isEdit ? existingExercise.name : "";

            const backdrop = document.getElementById('dynamic-modal-backdrop');
            const content = document.getElementById('dynamic-modal-content');

            function renderModal() {
                while (currentTargets.length < currentSetCount) currentTargets.push("10");
                while (currentTargets.length > currentSetCount) currentTargets.pop();

                content.innerHTML = `
                    <h3 class="text-lg font-bold text-white">${isEdit ? 'Modifica Esercizio' : 'Nuovo Esercizio'}</h3>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="text-slate-400 font-semibold block mb-1">Nome Esercizio</label>
                            <input id="modal-ex-name" type="text" value="${escapeHtml(nameVal)}" placeholder="Es. Panca Piana" 
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white focus:border-brand-500 focus:outline-none" />
                        </div>

                        <div class="flex items-center justify-between">
                            <label class="text-slate-400 font-semibold">Numero di Serie (Colonne)</label>
                            <div class="flex items-center space-x-2">
                                <button id="btn-sets-dec" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white hover:bg-slate-700">-</button>
                                <span class="font-bold text-sm text-white w-5 text-center">${currentSetCount}</span>
                                <button id="btn-sets-inc" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white hover:bg-slate-700">+</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-slate-400 font-semibold block">Obiettivo Rep per Serie</label>
                            <div class="grid grid-cols-3 gap-2">
                                ${currentTargets.map((t, idx) => `
                                    <div>
                                        <span class="text-[10px] text-slate-500 block mb-0.5">SET ${idx+1}</span>
                                        <input type="text" value="${escapeHtml(t)}" data-idx="${idx}" class="modal-target-input w-full py-1 px-2 text-center bg-slate-950 border border-slate-800 rounded-lg text-amber-400 font-mono font-bold focus:border-brand-500 focus:outline-none" />
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 justify-end pt-3 border-t border-slate-800">
                        <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">Annulla</button>
                        <button id="modal-save-btn" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-slate-950 text-xs font-bold">Salva</button>
                    </div>
                `;

                document.getElementById('modal-ex-name').oninput = (e) => { nameVal = e.target.value; };
                
                document.querySelectorAll('.modal-target-input').forEach(inp => {
                    inp.oninput = (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        currentTargets[idx] = e.target.value;
                    };
                });

                document.getElementById('btn-sets-dec').onclick = () => {
                    if (currentSetCount > 1) {
                        currentSetCount--;
                        renderModal();
                    }
                };

                document.getElementById('btn-sets-inc').onclick = () => {
                    if (currentSetCount < 10) {
                        currentSetCount++;
                        renderModal();
                    }
                };

                document.getElementById('modal-cancel-btn').onclick = () => {
                    backdrop.classList.add('hidden');
                };

                document.getElementById('modal-save-btn').onclick = () => {
                    if (!nameVal.trim()) {
                        showToast("Inserisci il nome dell'esercizio!");
                        return;
                    }
                    backdrop.classList.add('hidden');
                    onSaveCallback({
                        name: nameVal.trim(),
                        target: [...currentTargets]
                    });
                };
            }

            renderModal();
            backdrop.classList.remove('hidden');
        }

        function downloadDocx(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            showToast("Generazione file Word in corso...");

            try {
                const docxLib = window.docx;
                const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun, HeadingLevel, AlignmentType } = docxLib;

                const docChildren = [];

                docChildren.push(
                    new Paragraph({
                        text: routine.title.toUpperCase(),
                        heading: HeadingLevel.HEADING_1,
                        alignment: AlignmentType.CENTER,
                        spacing: { after: 300 }
                    })
                );

                routine.days.forEach((day) => {
                    docChildren.push(
                        new Paragraph({
                            text: day.name,
                            heading: HeadingLevel.HEADING_2,
                            spacing: { before: 200, after: 150 }
                        })
                    );

                    day.exercises.forEach((ex) => {
                        docChildren.push(
                            new Paragraph({
                                children: [
                                    new TextRun({ text: ex.name, bold: true, size: 22 })
                                ],
                                spacing: { before: 100, after: 80 }
                            })
                        );

                        const headerCells = [
                            new TableCell({
                                children: [new Paragraph({ children: [new TextRun({ text: "OBIETTIVO", bold: true })] })],
                                width: { size: 25, type: WidthType.PERCENTAGE }
                            })
                        ];
                        ex.target.forEach((t) => {
                            headerCells.push(
                                new TableCell({
                                    children: [new Paragraph({ children: [new TextRun({ text: t, bold: true })], alignment: AlignmentType.CENTER })],
                                    width: { size: 75 / ex.target.length, type: WidthType.PERCENTAGE }
                                })
                            );
                        });

                        const pesoCells = [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "PESO", bold: true })] })] })
                        ];
                        ex.weight.forEach((w) => {
                            pesoCells.push(
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: w || "" })], alignment: AlignmentType.CENTER })] })
                            );
                        });

                        const repCells = [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "REP", bold: true })] })] })
                        ];
                        ex.rep.forEach((r) => {
                            repCells.push(
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: r || "" })], alignment: AlignmentType.CENTER })] })
                            );
                        });

                        const table = new Table({
                            rows: [
                                new TableRow({ children: headerCells }),
                                new TableRow({ children: pesoCells }),
                                new TableRow({ children: repCells })
                            ],
                            width: { size: 100, type: WidthType.PERCENTAGE }
                        });

                        docChildren.push(table);

                        if (ex.note && ex.note.trim()) {
                            docChildren.push(
                                new Paragraph({
                                    children: [
                                        new TextRun({ text: `Note: ${ex.note}`, italic: true, size: 18 })
                                    ],
                                    spacing: { before: 60, after: 100 }
                                })
                            );
                        } else {
                            docChildren.push(new Paragraph({ text: "", spacing: { after: 120 } }));
                        }
                    });
                });

                const doc = new Document({
                    sections: [{ properties: {}, children: docChildren }]
                });

                Packer.toBlob(doc).then((blob) => {
                    const fileName = `${routine.title.replace(/[^a-zA-Z0-9\s]/g, '')}.docx`;
                    saveAs(blob, fileName);
                    showToast("Download avviato!");
                });

            } catch (err) {
                console.error("DOCX error:", err);
                showToast("Errore nella creazione del file Word.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        let modalCallback = null;
        function showModal(title, body, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            modalCallback = onConfirm;
            document.getElementById('modal-backdrop').classList.remove('hidden');

            document.getElementById('modal-confirm-btn').onclick = () => {
                if (modalCallback) modalCallback();
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
            modalCallback = null;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
